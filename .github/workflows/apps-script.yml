name: Deploy apps script
on:
  push:
    branches: [main]
    paths: ['apps-script/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @google/clasp
      - name: Setup clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

          printf '{"scriptId":"%s","rootDir":"apps-script","scriptExtensions":[".js",".gs"],"htmlExtensions":[".html"],"jsonExtensions":[".json"],"filePushOrder":[],"skipSubdirectories":false}\n' "$SCRIPT_ID" > .clasp.json

          node -e "JSON.parse(require('fs').readFileSync('.clasprc.json', 'utf8')); JSON.parse(require('fs').readFileSync('.clasp.json', 'utf8')); console.log('Both configuration files are valid JSON')"
      
      - run: npx clasp push --force
      - run: clasp deploy --deploymentId ${{ secrets.DEPLOY_ID }} --description "${{ github.sha }}"